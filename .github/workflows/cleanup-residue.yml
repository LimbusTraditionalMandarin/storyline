name: Clean up hidden-entry residue

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually push the changes (unchecked = dry-run report only)"
        type: boolean
        default: false
      context_only:
        description: "Only touch the context field, never translation"
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      PARATRANZ_TOKENS: ${{ secrets.PARATRANZ_TOKENS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run cleanup
        run: |
          ARGS="cleanup"
          if [ "${{ inputs.context_only }}" = "true" ]; then
            ARGS="$ARGS --context-only"
          fi
          if [ "${{ inputs.apply }}" = "true" ]; then
            ARGS="$ARGS --apply"
          fi
          echo "Running: uv run ptsd $ARGS"
          uv run ptsd $ARGS

      - name: Write job summary
        if: always()
        run: |
          echo "## Cleanup result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- apply: \`${{ inputs.apply }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- context_only: \`${{ inputs.context_only }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f cleanup_report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            jq '{cleared_blank: ([.reports[].cleared_blank] | add // 0), cleared_context: ([.reports[].cleared_context] | add // 0), flagged_maybe_wrongly_hidden: ([.reports[].flagged_maybe_wrongly_hidden | length] | add // 0), flagged_visible_placeholder: ([.reports[].flagged_visible_placeholder | length] | add // 0)}' cleanup_report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No cleanup_report.json produced._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-report
          path: cleanup_report.json
          if-no-files-found: warn
